name: Test e immagini
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_DATABASE: gestionale_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DB_TYPE: sqlite
      DB_NAME: ':memory:'
      SECRET_KEY: ci-only
      TEST_DATABASE_URL: ${{ matrix.database == 'mariadb' && 'mysql+pymysql://test:test-only@127.0.0.1:3306/gestionale_test' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest --cov=app --cov=routes --cov=permissions --cov=money
      - run: for script in ops/*.sh; do bash -n "$script"; done
      - run: node --test tests/csrf.test.cjs
      - run: docker compose --env-file /dev/null -f compose.development.yml config --quiet
        env:
          DB_ROOT_PASSWORD: ci-root
          DB_PASSWORD: ci-password
          SECRET_KEY: ci-secret
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nome immagine del repository corrente
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name == 'main' && 'main' || 'dev' }}
      - name: Avvio development e collaudo HTTP su dati di prova
        env:
          VCS_REF: ${{ github.sha }}
          DB_ROOT_PASSWORD: smoke-root-only
          DB_PASSWORD: smoke-db-only
          SECRET_KEY: smoke-secret-only
          SMOKE_PASSWORD: smoke-admin-password
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ github.sha }}" "gestionale-bilanci-development:$VCS_REF"
          docker compose --env-file /dev/null -f compose.development.yml up -d db
          docker compose --env-file /dev/null -f compose.development.yml run --rm \
            -e INITIAL_ADMIN_PASSWORD="$SMOKE_PASSWORD" --entrypoint sh web -ec 'flask db upgrade && flask init-db'
          docker compose --env-file /dev/null -f compose.development.yml up -d --no-build --wait
          python ops/smoke-development.py
          mkdir -p /tmp/bilanci-ci-backups
          # Eseguire gli script veri contro i container della prova, mai contro VM108.
          # I nomi della beta legacy vengono creati SOLO nel runner effimero.
          docker rename "$(docker compose --env-file /dev/null -f compose.development.yml ps -q db)" bilanci-db
          docker rename "$(docker compose --env-file /dev/null -f compose.development.yml ps -q web)" bilanci-web
          bash ops/backup-beta.sh /tmp/bilanci-ci-backups
          backup_dir=$(find /tmp/bilanci-ci-backups -mindepth 1 -maxdepth 1 -type d | head -n 1)
          bash ops/restore-drill.sh "$backup_dir"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pubblica soltanto dopo tutti i collaudi
        if: github.event_name == 'push'
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:${{ github.ref_name }}"
